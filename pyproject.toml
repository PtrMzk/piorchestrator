[project]
name = "po"
version = "0.1.0"
description = "An orchestrator built on top of Claude Code CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["rich>=13.0"]

[project.scripts]
po = "po.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/po"]

[tool.hatch.build.targets.wheel.force-include]
"src/po/sandbox/Dockerfile" = "po/sandbox/Dockerfile"
"src/po/sandbox/entrypoint.sh" = "po/sandbox/entrypoint.sh"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["docker: tests requiring Docker daemon (deselect with -m 'not docker')"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]
